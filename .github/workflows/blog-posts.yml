name: Sync latest blog posts

on:
  schedule:
    # Twice a day, deliberately off :00
    - cron: "23 5,17 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Pull the five most recent posts into the README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://aniksarkerakash.com/blog/feed.xml"
          max_post_count: 5
          # The action otherwise joins the opening marker directly to the
          # first list item, which breaks the marker's own line.
          tag_post_pre_newline: true
          # $newline is the action's own variable. A literal "\n" here is
          # emitted verbatim, which is why every post used to land on one line.
          template: "- [$title]($url)$newline"
          # Without this, an apostrophe in a title ships as &#39; inside the
          # link text, where markdown will not decode it.
          disable_html_encoding: true
          commit_message: "chore: sync latest blog posts"
