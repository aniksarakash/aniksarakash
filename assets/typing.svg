<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" role="img" aria-label="Three legacy systems, two spreadsheets, one person clicking. / I replace that with something that runs itself. / Frontier models + enterprise IT + ruthless code review.">
  <title>Three legacy systems, two spreadsheets, one person clicking. / I replace that with something that runs itself. / Frontier models + enterprise IT + ruthless code review.</title>

  <!-- Self-hosted replacement for readme-typing-svg.demolab.com: same three
       lines, same JetBrains Mono / #06B6D4 / 1.4s pause, no third party.
       JetBrains Mono advances exactly 0.6em, so steps(n) over a line's box
       reveals one character per step. The cycle opens on line 1 fully typed,
       so a t=0 raster shows a sentence, not a blank strip. Lines 2 and 3 are
       visibility="hidden" until their animation runs, so a CSS-less renderer
       and reduced motion both get line 1 alone. Cycle: 17.72s.
       Re-run scripts/embed-fonts.py after editing the copy. -->

  <defs>
    <style>
      /* @font-face:start (generated by scripts/embed-fonts.py) */
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400 800; src: url(data:font/woff2;base64,) format('woff2'); }
      /* @font-face:end */
      .fm { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .ln { font-size: 20px; font-weight: 600; fill: #06b6d4; }
      .cur { fill: #f59e0b; }
      .l1 { animation: t1 17.724s infinite; }
      .l2 { animation: t2 17.724s infinite; }
      .l3 { animation: t3 17.724s infinite; }
      .c1 { animation: c1 17.724s infinite; }
      .c2 { animation: c2 17.724s infinite; }
      .c3 { animation: c3 17.724s infinite; }
      @keyframes t1 {
        0% { clip-path: inset(0 0 0 0); }
        7.899% { clip-path: inset(0 0 0 0); animation-timing-function: steps(60, end); }
        15.346% { clip-path: inset(0 100% 0 0); animation-timing-function: step-end; }
        81.381% { clip-path: inset(0 100% 0 0); animation-timing-function: steps(60, end); }
        100% { clip-path: inset(0 0 0 0); }
      }
      @keyframes c1 {
        0% { transform: translateX(720px); opacity: 1; }
        7.899% { transform: translateX(720px); opacity: 1; animation-timing-function: steps(60, end); }
        15.346% { transform: translateX(0px); opacity: 1; animation-timing-function: step-end; }
        17.321% { transform: translateX(0px); opacity: 0; animation-timing-function: step-end; }
        81.381% { transform: translateX(0px); opacity: 1; animation-timing-function: steps(60, end); }
        100% { transform: translateX(720px); opacity: 1; }
      }
      @keyframes t2 {
        0% { clip-path: inset(0 100% 0 0); visibility: visible; animation-timing-function: step-end; }
        17.321% { clip-path: inset(0 100% 0 0); visibility: visible; animation-timing-function: steps(47, end); }
        31.906% { clip-path: inset(0 0 0 0); visibility: visible; animation-timing-function: step-end; }
        39.805% { clip-path: inset(0 0 0 0); visibility: visible; animation-timing-function: steps(47, end); }
        45.639% { clip-path: inset(0 100% 0 0); visibility: visible; animation-timing-function: step-end; }
        100% { clip-path: inset(0 100% 0 0); visibility: visible; }
      }
      @keyframes c2 {
        0% { transform: translateX(0px); opacity: 0; animation-timing-function: step-end; }
        17.321% { transform: translateX(0px); opacity: 1; animation-timing-function: steps(47, end); }
        31.906% { transform: translateX(564px); opacity: 1; animation-timing-function: step-end; }
        39.805% { transform: translateX(564px); opacity: 1; animation-timing-function: steps(47, end); }
        45.639% { transform: translateX(0px); opacity: 1; animation-timing-function: step-end; }
        47.613% { transform: translateX(0px); opacity: 0; animation-timing-function: step-end; }
        100% { transform: translateX(0px); opacity: 0; }
      }
      @keyframes t3 {
        0% { clip-path: inset(0 100% 0 0); visibility: visible; animation-timing-function: step-end; }
        47.613% { clip-path: inset(0 100% 0 0); visibility: visible; animation-timing-function: steps(55, end); }
        64.681% { clip-path: inset(0 0 0 0); visibility: visible; animation-timing-function: step-end; }
        72.580% { clip-path: inset(0 0 0 0); visibility: visible; animation-timing-function: steps(55, end); }
        79.406% { clip-path: inset(0 100% 0 0); visibility: visible; animation-timing-function: step-end; }
        100% { clip-path: inset(0 100% 0 0); visibility: visible; }
      }
      @keyframes c3 {
        0% { transform: translateX(0px); opacity: 0; animation-timing-function: step-end; }
        47.613% { transform: translateX(0px); opacity: 1; animation-timing-function: steps(55, end); }
        64.681% { transform: translateX(660px); opacity: 1; animation-timing-function: step-end; }
        72.580% { transform: translateX(660px); opacity: 1; animation-timing-function: steps(55, end); }
        79.406% { transform: translateX(0px); opacity: 1; animation-timing-function: step-end; }
        81.381% { transform: translateX(0px); opacity: 0; animation-timing-function: step-end; }
        100% { transform: translateX(0px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ln, .cur { animation: none; }
      }
    </style>
  </defs>

  <text class="fm ln l1" x="40" y="27">Three legacy systems, two spreadsheets, one person clicking.</text>
  <rect class="cur c1" x="42" y="11" width="10" height="20" rx="1" transform="translate(720 0)"/>
  <text class="fm ln l2" x="118" y="27" visibility="hidden">I replace that with something that runs itself.</text>
  <rect class="cur c2" x="120" y="11" width="10" height="20" rx="1" opacity="0"/>
  <text class="fm ln l3" x="70" y="27" visibility="hidden">Frontier models + enterprise IT + ruthless code review.</text>
  <rect class="cur c3" x="72" y="11" width="10" height="20" rx="1" opacity="0"/>
</svg>
