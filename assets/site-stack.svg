<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img"
     fill="#f3eee4"
     aria-label="aniksarkerakash.com as one repository with four separate builds. Portfolio at the site root: six sticky SVG stages scrubbed to scroll position, no canvas and no WebGL, built with React 19, anime.js 4, GSAP, Lenis and Zustand, and zero React re-renders while scrolling. Writing engine at slash blog: first-party markdown, diagram and chart renderers with no runtime chart library, covering flowcharts, nine chart block languages and seeded generative covers. Publishing at slash blog slash admin: one dependency-free PHP file that deploys inside dist like any other asset, with drafts, scheduling, uploads and server-side feed regeneration, needing no database and no install. Lab at slash lab slash chimes: wind chimes that ring from pendulum physics rather than a schedule, using modal synthesis, a WebGL2 shader and seeded permalinks. The blog entry never loads GSAP, anime.js or Lenis.">
  <title>One domain, four builds, and strict rules about what each one may load</title>

  <!-- Root fill is the inherited fallback for text; .ink-* classes carry the hierarchy.
       If the stylesheet is dropped the labels degrade to readable bone, not black. -->

  <defs>
    <linearGradient id="site-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <style>
      .fs { font-family: 'Space Grotesk', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .fm { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .ink-1 { fill: #f3eee4 }
      .ink-2 { fill: #a9a3bd }
      .ink-3 { fill: #6f6a85 }
      .hd  { font-size: 13.5px; font-weight: 600 }
      .nm  { font-size: 12.5px; font-weight: 600 }
      .sb  { font-size: 10px }
      .tg  { font-size: 9px; letter-spacing: .4px }
      .pill { font-size: 8.5px; font-weight: 700; letter-spacing: .7px }

      /* Decoration only: a transform-only rise. Content never animates opacity, so a
         renderer that captures frame zero still gets every band fully drawn. */
      @keyframes rise { from { transform: translateY(7px) } to { transform: translateY(0) } }
      .band { animation: rise .5s cubic-bezier(.2,.7,.3,1) both }
      .b1 { animation-delay: .06s } .b2 { animation-delay: .13s }
      .b3 { animation-delay: .20s } .b4 { animation-delay: .27s }
      @media (prefers-reduced-motion: reduce) { .band { animation: none } }
    </style>
  </defs>

  <rect width="1000" height="368" rx="14" fill="#030014"/>
  <rect x="1" y="1" width="998" height="366" rx="13" fill="url(#site-surface)" stroke="#1c1c2b"/>

  <text class="fs hd" x="34" y="40" fill="#f3eee4">One repository, four builds</text>
  <text class="fm sb ink-3" x="34" y="59">shared design tokens, separate entries, and a strict rule about what each one may load</text>

  <!-- ── build 1 · the scroll-driven portfolio ──────────────────────────── -->
  <g class="band b1">
    <rect x="34" y="82" width="3" height="46" rx="1.5" fill="#7c3aed"/>
    <text class="fs nm ink-1" x="50" y="98">Portfolio</text>
    <text class="fm tg ink-3" x="128" y="98">/</text>
    <text class="fm sb ink-2" x="50" y="117">six sticky SVG stages, scrubbed to scroll position, no canvas or WebGL</text>
    <rect x="742" y="82" width="224" height="20" rx="10" fill="#0a0a0f" stroke="#7c3aed" stroke-width="1.3"/>
    <text class="fm pill" x="854" y="96" text-anchor="middle" fill="#7c3aed">0 RE-RENDERS ON SCROLL</text>
    <text class="fm tg ink-3" x="966" y="121" text-anchor="end">React 19 · anime.js 4 · GSAP · Lenis · Zustand</text>
  </g>

  <!-- ── build 2 · the writing engine ───────────────────────────────────── -->
  <g class="band b2">
    <rect x="34" y="150" width="3" height="46" rx="1.5" fill="#06b6d4"/>
    <text class="fs nm ink-1" x="50" y="166">Writing engine</text>
    <text class="fm tg ink-3" x="162" y="166">/blog/</text>
    <text class="fm sb ink-2" x="50" y="185">first-party markdown, diagram and chart renderers, zero dependencies</text>
    <rect x="742" y="150" width="224" height="20" rx="10" fill="#0a0a0f" stroke="#06b6d4" stroke-width="1.3"/>
    <text class="fm pill" x="854" y="164" text-anchor="middle" fill="#06b6d4">NO RUNTIME CHART LIBRARY</text>
    <text class="fm tg ink-3" x="966" y="189" text-anchor="end">flowcharts · nine chart blocks · seeded covers</text>
  </g>

  <!-- ── build 3 · the self-built CMS ───────────────────────────────────── -->
  <g class="band b3">
    <rect x="34" y="218" width="3" height="46" rx="1.5" fill="#f59e0b"/>
    <text class="fs nm ink-1" x="50" y="234">Publishing</text>
    <text class="fm tg ink-3" x="134" y="234">/blog/admin</text>
    <text class="fm sb ink-2" x="50" y="253">one dependency-free PHP file that deploys inside dist like any asset</text>
    <rect x="742" y="218" width="224" height="20" rx="10" fill="#0a0a0f" stroke="#f59e0b" stroke-width="1.3"/>
    <text class="fm pill" x="854" y="232" text-anchor="middle" fill="#f59e0b">NO DATABASE, NO INSTALL</text>
    <text class="fm tg ink-3" x="966" y="257" text-anchor="end">drafts · scheduling · uploads · server-side feeds</text>
  </g>

  <!-- ── build 4 · the lab, where the physics lives ─────────────────────── -->
  <g class="band b4">
    <rect x="34" y="286" width="3" height="46" rx="1.5" fill="#ec4899"/>
    <text class="fs nm ink-1" x="50" y="302">Lab</text>
    <text class="fm tg ink-3" x="86" y="302">/lab/chimes</text>
    <text class="fm sb ink-2" x="50" y="321">wind chimes that ring from pendulum physics, not from a schedule</text>
    <rect x="742" y="286" width="224" height="20" rx="10" fill="#0a0a0f" stroke="#ec4899" stroke-width="1.3"/>
    <text class="fm pill" x="854" y="300" text-anchor="middle" fill="#ec4899">THE SEED IS THE SCORE</text>
    <text class="fm tg ink-3" x="966" y="325" text-anchor="end">modal synthesis · WebGL2 shader · seeded permalinks</text>
  </g>

  <line x1="34" y1="344" x2="966" y2="344" stroke="#1c1c2b" stroke-width="1"/>
  <text class="fm tg ink-3" x="34" y="360">The blog entry never loads GSAP, anime.js or Lenis. A reader pays for the page they opened, not the one next door.</text>
</svg>
