<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Let's build something that ships. Contact Anik Sarker Akash.">
  <title>Let's build something that ships</title>
  <defs>
    <linearGradient id="fink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f69e8" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fclip"><rect width="1200" height="180" rx="18"/></clipPath>
    <style>
      /* @font-face:start (generated by scripts/embed-fonts.py) */
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400 800; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(data:font/woff2;base64,) format('woff2'); }
      /* @font-face:end */
      .fs { font-family: 'Space Grotesk', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .fm { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .fe { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; }
      .w1 { animation: slide 12s linear infinite; }
      .w2 { animation: slide 18s linear infinite reverse; }
      @keyframes slide { from { transform: translateX(0) } to { transform: translateX(-600px) } }
      .bob { animation: bob 3.4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { opacity:.3 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) { .w1,.w2,.bob { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1200" height="180" fill="url(#fink)"/>

    <g opacity="0.9">
      <path class="w1" d="M0 132 Q 150 92 300 132 T 600 132 T 900 132 T 1200 132 T 1500 132 T 1800 132"
            fill="none" stroke="url(#wave1)" stroke-width="2"/>
      <path class="w2" d="M0 154 Q 150 186 300 154 T 600 154 T 900 154 T 1200 154 T 1500 154 T 1800 154"
            fill="none" stroke="url(#wave2)" stroke-width="2"/>
    </g>

    <text class="fe" x="600" y="72" font-size="34" fill="#f3eee4" text-anchor="middle">
      Let's build something that actually ships.
    </text>
    <text class="fm" x="600" y="102" font-size="12.5" letter-spacing="3.4" fill="#7f7a95" text-anchor="middle">
      AI SOLUTIONS  ·  AUTOMATION  ·  ENTERPRISE IT
    </text>

    <g transform="translate(600, 126)">
      <circle class="bob" cx="-96" cy="0" r="3" fill="#4f69e8"/>
      <circle class="bob" cx="-48" cy="0" r="3" fill="#7c3aed" style="animation-delay:.4s"/>
      <circle class="bob" cx="0"   cy="0" r="3" fill="#06b6d4" style="animation-delay:.8s"/>
      <circle class="bob" cx="48"  cy="0" r="3" fill="#f59e0b" style="animation-delay:1.2s"/>
      <circle class="bob" cx="96"  cy="0" r="3" fill="#ec4899" style="animation-delay:1.6s"/>
    </g>

    <rect width="1198" height="178" x="1" y="1" rx="17" fill="none" stroke="#f3eee4" stroke-opacity="0.10"/>
  </g>
</svg>
