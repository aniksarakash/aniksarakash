<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img"
     fill="#f3eee4"
     aria-label="Delivery time before and after AI-assisted development. CRM ticketing system: 6 months down to 2 months, 67 percent faster. Report generation app: 30 days down to 3 days, 90 percent faster. Bill approval system: 4 weeks down to 2 weeks, 50 percent faster.">
  <title>Delivery time — original estimate vs. AI-assisted build</title>

  <!-- The root fill is the inherited fallback for text. The .ink-* classes below
       carry the real hierarchy and override it (CSS beats inheritance), but if
       the stylesheet is ever dropped the labels degrade to readable bone rather
       than to the SVG default of black, which is invisible on this surface. -->

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <!-- One accent for the whole "after" series: color encodes before/after, never rank -->
    <linearGradient id="after" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f69e8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      .fs { font-family: 'Space Grotesk', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .fm { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace; }
      .ink-1 { fill: #f3eee4 }   /* primary text   */
      .ink-2 { fill: #a9a3bd }   /* secondary text */
      .ink-3 { fill: #6f6a85 }   /* muted text     */
      @media (prefers-reduced-motion: reduce) { animate { animation: none } }
    </style>
  </defs>

  <rect width="1000" height="330" rx="16" fill="url(#surface)"/>
  <rect x="0.5" y="0.5" width="999" height="329" rx="16" fill="none" stroke="#f3eee4" stroke-opacity="0.10"/>

  <!-- Title block -->
  <text class="fs ink-1" x="34" y="42" font-size="19" font-weight="700">Delivery time, before and after</text>
  <text class="fm ink-3" x="34" y="64" font-size="12">Each track is the original estimate. The filled bar is what actually shipped.</text>

  <!-- Legend — identity is never carried by color alone -->
  <g transform="translate(660, 34)">
    <rect x="0" y="0" width="11" height="11" rx="3" fill="#f3eee4" fill-opacity="0.10"/>
    <text class="fm ink-2" x="18" y="10" font-size="11.5">Original estimate</text>
    <rect x="150" y="0" width="11" height="11" rx="3" fill="url(#after)"/>
    <text class="fm ink-2" x="168" y="10" font-size="11.5">Shipped</text>
  </g>

  <!-- ── Row 1 · CRM ticketing · 6 months → 2 months ────────────────── -->
  <g transform="translate(0, 96)">
    <text class="fs ink-1" x="34" y="14" font-size="14" font-weight="600">Custom CRM Ticketing System</text>
    <text class="fm ink-3" x="34" y="34" font-size="11.5">6 months <tspan class="ink-2">→</tspan> 2 months</text>
    <rect x="330" y="2" width="530" height="24" rx="12" fill="#f3eee4" fill-opacity="0.07"/>
    <!-- Bars carry their final width and animate up from 0, so the chart is
         still readable where SMIL is unsupported. width="0" + fill="freeze"
         renders three empty tracks. -->
    <rect x="330" y="2" width="177" height="24" rx="12" fill="url(#after)">
      <animate attributeName="width" from="0" to="177" dur="1.1s" begin="0.25s"
               calcMode="spline" keySplines="0.22 0.61 0.36 1" fill="freeze"/>
    </rect>
    <text class="fm ink-1" x="884" y="20" font-size="15" font-weight="700" fill="#10b981">−67%</text>
  </g>

  <!-- ── Row 2 · Report generator · 30 days → 3 days ────────────────── -->
  <g transform="translate(0, 166)">
    <text class="fs ink-1" x="34" y="14" font-size="14" font-weight="600">Complex Report Generation App</text>
    <text class="fm ink-3" x="34" y="34" font-size="11.5">1 month <tspan class="ink-2">→</tspan> 3 days</text>
    <rect x="330" y="2" width="530" height="24" rx="12" fill="#f3eee4" fill-opacity="0.07"/>
    <rect x="330" y="2" width="53" height="24" rx="12" fill="url(#after)">
      <animate attributeName="width" from="0" to="53" dur="1.1s" begin="0.4s"
               calcMode="spline" keySplines="0.22 0.61 0.36 1" fill="freeze"/>
    </rect>
    <text class="fm ink-1" x="884" y="20" font-size="15" font-weight="700" fill="#10b981">−90%</text>
  </g>

  <!-- ── Row 3 · Bill approval · 4 weeks → 2 weeks ──────────────────── -->
  <g transform="translate(0, 236)">
    <text class="fs ink-1" x="34" y="14" font-size="14" font-weight="600">Bill Approval System</text>
    <text class="fm ink-3" x="34" y="34" font-size="11.5">4 weeks <tspan class="ink-2">→</tspan> 2 weeks</text>
    <rect x="330" y="2" width="530" height="24" rx="12" fill="#f3eee4" fill-opacity="0.07"/>
    <rect x="330" y="2" width="265" height="24" rx="12" fill="url(#after)">
      <animate attributeName="width" from="0" to="265" dur="1.1s" begin="0.55s"
               calcMode="spline" keySplines="0.22 0.61 0.36 1" fill="freeze"/>
    </rect>
    <text class="fm ink-1" x="884" y="20" font-size="15" font-weight="700" fill="#10b981">−50%</text>
  </g>

  <text class="fm ink-3" x="34" y="312" font-size="10.5" opacity="0.8">
    Estimates are the pre-AI baseline agreed with stakeholders at kickoff.
  </text>
</svg>
